<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página corta</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      text-align: center;
    }
    button {
      background: #2196f3;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>¡Hola!</h1>
    <p>Esta es una página HTML corta.</p>
    <button>Enviar</button>
  </div>
</body>
</html>
